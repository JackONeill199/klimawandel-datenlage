name: Seite veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # Tägliche Momentaufnahme. GitHub führt geplante Läufe bei Last gelegentlich
    # später aus; der Zeitpunkt ist deshalb unkritisch gewählt.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Statische Fassung bauen (Quellen werden dabei abgerufen)
        run: npm run build:site
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site
          # Das Artefakt enthält auch die versteckte .nojekyll-Datei.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
